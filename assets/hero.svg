<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"><animate attributeName="stop-color" values="#070A12;#0B1020;#070A12" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.52" stop-color="#0D1021"><animate attributeName="stop-color" values="#0D1021;#15102B;#0D1021" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#090B16"><animate attributeName="stop-color" values="#090B16;#07131D;#090B16" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="accent" x1="92" y1="90" x2="706" y2="265" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#A855F7;#F472B6;#22D3EE" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="0.48" stop-color="#A855F7"><animate attributeName="stop-color" values="#A855F7;#F472B6;#22D3EE;#A855F7" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#F472B6"><animate attributeName="stop-color" values="#F472B6;#22D3EE;#A855F7;#F472B6" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="panel" x1="760" y1="72" x2="1090" y2="294" gradientUnits="userSpaceOnUse"><stop stop-color="#151A31" stop-opacity="0.96"/><stop offset="1" stop-color="#0B1020" stop-opacity="0.92"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.14"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#6D7DA8" stroke-opacity="0.09"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="url(#accent)" stroke-opacity="0.62" stroke-width="2" stroke-dasharray="18 8"><animate attributeName="stroke-dashoffset" from="0" to="-52" dur="3s" repeatCount="indefinite"/></rect>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="8" y="-50" width="1184" height="70" rx="18" fill="url(#scan)"><animate attributeName="y" values="-70;360" dur="5.5s" repeatCount="indefinite"/></rect>

  <circle cx="151" cy="38" r="92" fill="#22D3EE" fill-opacity="0.10" filter="url(#soft)"><animate attributeName="r" values="78;112;78" dur="6s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.07;0.16;0.07" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="681" cy="345" r="120" fill="#A855F7" fill-opacity="0.12" filter="url(#soft)"><animate attributeName="r" values="105;140;105" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="1116" cy="40" r="100" fill="#F472B6" fill-opacity="0.09" filter="url(#soft)"><animate attributeName="r" values="88;122;88" dur="5s" repeatCount="indefinite"/></circle>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="72" y="55" width="194" height="30" rx="15" fill="#11182B" stroke="#22D3EE" stroke-opacity="0.55"/>
    <circle cx="91" cy="70" r="4" fill="#22D3EE" filter="url(#glow)"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.3s" repeatCount="indefinite"/></circle>
    <text x="104" y="75" fill="#AAB5D3" font-size="13" font-weight="600" letter-spacing="1.5">GITHUB / ILONLOST</text>

    <text x="70" y="178" fill="url(#accent)" font-size="78" font-weight="800" letter-spacing="7">ILONLOST<animate attributeName="fill-opacity" values="0.86;1;0.86" dur="2.8s" repeatCount="indefinite"/></text>
    <text x="75" y="218" fill="#C9D1E6" font-size="17" font-weight="600" letter-spacing="3.2">IT AUTOMATION  /  INFRASTRUCTURE  /  CODE</text>

    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.5s" repeatCount="indefinite"/>
      <rect x="73" y="258" width="105" height="34" rx="8" fill="#22D3EE" fill-opacity="0.1" stroke="#22D3EE" stroke-opacity="0.46"/><text x="99" y="280" fill="#70E8F7" font-size="13" font-weight="700" letter-spacing="1">PYTHON</text>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" begin="0.4s" dur="3.5s" repeatCount="indefinite"/>
      <rect x="190" y="258" width="102" height="34" rx="8" fill="#A855F7" fill-opacity="0.1" stroke="#A855F7" stroke-opacity="0.5"/><text x="216" y="280" fill="#C98AFB" font-size="13" font-weight="700" letter-spacing="1">MSSQL</text>
    </g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" begin="0.8s" dur="3.5s" repeatCount="indefinite"/>
      <rect x="304" y="258" width="143" height="34" rx="8" fill="#F472B6" fill-opacity="0.09" stroke="#F472B6" stroke-opacity="0.48"/><text x="324" y="280" fill="#F7A4CF" font-size="13" font-weight="700" letter-spacing="1">NETWORKING</text>
    </g>

    <g>
      <rect x="758" y="60" width="372" height="240" rx="18" fill="url(#panel)" stroke="#8B5CF6" stroke-opacity="0.52"/>
      <rect x="758" y="60" width="372" height="42" rx="18" fill="#161C34"/>
      <path d="M758 102H1130" stroke="#39405D" stroke-opacity="0.7"/>
      <circle cx="783" cy="81" r="5" fill="#F472B6"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="802" cy="81" r="5" fill="#A855F7"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="821" cy="81" r="5" fill="#22D3EE"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/></circle>
      <text x="958" y="86" text-anchor="middle" fill="#7F8AA8" font-size="12" letter-spacing="1.2">system.profile</text>

      <g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="6s" repeatCount="indefinite"/><text x="788" y="139" fill="#22D3EE" font-size="15" font-family="Consolas, monospace">01</text><text x="826" y="139" fill="#D6DCF0" font-size="15" font-family="Consolas, monospace">build reliable tools</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.27;0.85;1" dur="6s" repeatCount="indefinite"/><text x="788" y="181" fill="#A855F7" font-size="15" font-family="Consolas, monospace">02</text><text x="826" y="181" fill="#D6DCF0" font-size="15" font-family="Consolas, monospace">connect systems &amp; people</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.42;0.85;1" dur="6s" repeatCount="indefinite"/><text x="788" y="223" fill="#F472B6" font-size="15" font-family="Consolas, monospace">03</text><text x="826" y="223" fill="#D6DCF0" font-size="15" font-family="Consolas, monospace">automate the boring stuff</text><rect x="1064" y="209" width="8" height="17" rx="1" fill="#22D3EE"><animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/></rect></g>

      <path d="M790 260H1088" stroke="#28314F" stroke-width="2"/>
      <path id="wave" d="M790 260C830 244 859 276 900 260C943 243 970 279 1018 260C1044 250 1065 251 1088 260" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 10" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-68" dur="2s" repeatCount="indefinite"/></path>
      <circle r="5" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="3s" repeatCount="indefinite" path="M790 260C830 244 859 276 900 260C943 243 970 279 1018 260C1044 250 1065 251 1088 260"/></circle>
    </g>
  </g>
</svg>
