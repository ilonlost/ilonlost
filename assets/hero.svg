<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"/>
      <stop offset="0.52" stop-color="#0D1021"/>
      <stop offset="1" stop-color="#090B16"/>
    </linearGradient>
    <linearGradient id="accent" x1="92" y1="90" x2="706" y2="265" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
